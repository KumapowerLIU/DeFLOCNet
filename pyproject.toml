[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deflocnet"
version = "0.1.0"
description = "DeFLOCNet with explicit controls and reproducible PyTorch 2 training"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "torchvision>=0.21", "numpy>=1.24", "Pillow>=10", "scipy>=1.10", "scikit-image>=0.24,<0.26", "lpips==0.1.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
demo = ["gradio>=6.9,<7", "opencv-python-headless>=4.9,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deflocnet = ["draw_canvas.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
